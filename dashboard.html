<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Dashboard - Ministry of Education</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* [Existing Styles Kept, Plus New Lesson Styles Below] */
        :root { --moe-amber: #d35400; --moe-light: #f39c12; }
        
        /* New Lesson Components */
        .lesson-container { max-width: 800px; margin: auto; }
        .lesson-header { color: var(--moe-amber); border-bottom: 2px solid var(--moe-amber); padding-bottom: 10px; margin-bottom: 30px; }
        
        .viewfinder { background: #fffdf5; border: 2px solid #f39c12; border-radius: 8px; padding: 20px; margin-bottom: 30px; position: relative; }
        .section-icon { width: 40px; height: 40px; vertical-align: middle; margin-right: 15px; }
        
        .take-note { background: #fdfdfd; border-left: 5px solid #bdc3c7; padding: 15px 20px; margin: 20px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .file-section { background: #f0f0f0; border-radius: 6px; padding: 15px; margin-top: 40px; display: flex; align-items: center; }
        
        .lesson-image { max-width: 40%; border-radius: 8px; margin: 0 20px 20px 0; }
        .lesson-image.right { float: right; margin: 0 0 20px 20px; }

        /* Interactive Activity Styling */
        .activity-box { border: 2px dashed #d35400; padding: 20px; border-radius: 8px; background: #fff8f0; }
        .activity-item { padding: 10px; margin: 5px; background: white; border: 1px solid #ddd; cursor: pointer; display: inline-block; border-radius: 4px; }
    </style>
</head>
<body>
    <!-- (Rest of your HTML structure remains the same as previously provided) -->
    <!-- [Ensure your script handles the rendering of these new CSS classes] -->
</body>
</html>
